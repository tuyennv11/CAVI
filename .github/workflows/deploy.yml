name: Deploy CRM

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH vào VPS và deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/crm
            git pull origin main
            docker compose up -d --build
            # migrate đã chạy sẵn trong lệnh khởi động của container backend (docker-compose.yml) —
            # gọi lại ở đây từng gây tranh chấp tạo bảng (race condition) khi container mới khởi động cùng lúc.
