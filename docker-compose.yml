services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    # collectstatic chạy lại ở ĐÂY (lúc container khởi động), không chỉ lúc build image — volume
    # "static" là volume riêng, sống lâu dài qua nhiều lần deploy, nên nó CHE MẤT file static mới
    # build trong image (Docker chỉ tự chép file image vào volume ở lần đầu volume rỗng, các lần
    # sau volume cũ luôn thắng). Không chạy lại collectstatic mỗi lần start thì thêm app/thư viện
    # mới (vd import_export) sẽ build xong trong image nhưng static không bao giờ lên tới server.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py seed_groups &&
             python manage.py import_vn_divisions &&
             python manage.py import_kh_la_divisions &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile.nginx
      args:
        VITE_API_URL: https://app.vantaiduongbo.net
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static:/app/staticfiles:ro
      - media:/app/media:ro

volumes:
  pgdata:
  static:
  media:
