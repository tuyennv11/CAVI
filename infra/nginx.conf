# Cloudflare (proxy bật, mây cam) lo phần SSL cho khách truy cập.
# nginx chỉ cần nhận HTTP thường trên cổng 80.
# / phục vụ giao diện web CRM (React, đã build tĩnh) — /api/ và /admin/ chuyển vào Django.

server {
    listen 80;
    server_name app.vantaiduongbo.net;
    client_max_body_size 20M;

    # Cloudflare luôn nói với trình duyệt là https, nhưng khi thiếu dấu "/" ở cuối
    # (vd. gõ .../admin thay vì .../admin/), nginx tự thêm "/" và dùng $scheme của
    # chính nó (http, vì Cloudflare nói chuyện với nginx bằng http thường) để tạo
    # URL chuyển hướng — kết quả là trình duyệt bị đẩy sang http://, trình duyệt
    # hiện đại chặn vì coi là hạ cấp bảo mật. Khai báo tường minh 2 case này để luôn
    # chuyển hướng đúng bằng https, không phụ thuộc $scheme mặc định.
    location = /admin {
        return 301 https://$host/admin/;
    }

    location = /api {
        return 301 https://$host/api/;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Service Worker phải luôn được kiểm tra lại sau mỗi lần deploy. Nếu Cloudflare
    # cache sw.js, trình duyệt sẽ tiếp tục phục vụ cả HTML/JS cũ dù mã mới đã lên VPS.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
