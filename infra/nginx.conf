# Cloudflare (proxy bật, mây cam) lo phần SSL cho khách truy cập.
# nginx chỉ cần nhận HTTP thường trên cổng 80.
# / phục vụ giao diện web CRM (React, đã build tĩnh) — /api/ và /admin/ chuyển vào Django.

server {
    listen 80;
    server_name app.vantaiduongbo.net;
    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
